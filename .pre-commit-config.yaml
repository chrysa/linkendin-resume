default_language_version:
  python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
- hooks:
  - args:
    - --maxkb=500
    id: check-added-large-files
  - exclude: ^(\.csslintrc|app/node_modules/|app/dist/|node_modules/|dist/)
    id: check-json
  - id: check-merge-conflict
  - args:
    - --allow-multiple-documents
    id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: detect-private-key
  - args:
    - --branch
    - main
    id: no-commit-to-branch
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
- hooks:
  - additional_dependencies:
    - prettier@^3.9.4
    - prettier-plugin-organize-imports@^4.3.0
    args:
    - --print-width=120
    - --tab-width=2
    - --use-tabs=false
    - --single-quote
    - --trailing-comma=es5
    exclude: ^(app/dist/|app/coverage/|app/node_modules/|dist/|coverage/|node_modules/)
    files: ^app/.*\.(css|js|ts|tsx|json|md)$
    id: prettier
  repo: https://github.com/pre-commit/mirrors-prettier
  rev: v4.0.0-alpha.8
- hooks:
  - id: actionlint
  repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
- hooks:
  - id: gitleaks
  repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
- hooks:
  - id: makefile-check
  - files: \.(js|gs|ts|tsx|jsx)$
    id: console-debug-detection
  - files: \.(js|gs|ts|tsx|jsx)$
    id: console-log-detection
  - files: \.(js|gs|ts|tsx|jsx)$
    id: console-table-detection
  - id: react-console-error-detection
  - id: no-console-warn
  - additional_dependencies:
    - tree-sitter>=0.25.2
    - tree-sitter-typescript>=0.23.2
    id: ts-unreachable-code
  - id: css-duplicate-property
  - id: import-no-relative-parent
  - id: react-direct-dom
  - id: dockerfile-no-latest
  - id: env-file-check
  - exclude: ^(\.github/(workflows|ISSUE_TEMPLATE)/|GitVersion\.yml)
    id: yaml-sorter
  - id: regression-gate
    stages:
    - pre-push
  - exclude: ^(\.csslintrc|app/|node_modules/|dist/)
    id: json-sorter
  - id: env-example-sync
  - id: adr-gate
  - id: debugger-detection
  - id: python-print-detection
  - exclude: tests?/
    id: python-pprint-detection
  - id: no-bare-except
  - id: python-logger-detection
  - id: python-unreachable-code
  - exclude: tests?/|\.test\.|\.spec\.
    id: no-hardcoded-localhost
  repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.1.1-95
- hooks:
  - args:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
    - perf
    - revert
    - ci
    id: conventional-pre-commit
    stages:
    - commit-msg
  repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
- hooks:
  - args:
    - --fix
    id: markdownlint
    stages:
    - manual
  repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.0
