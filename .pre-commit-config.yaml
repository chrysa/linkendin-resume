default_language_version:
  python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
    args:
    - --maxkb=500
  - id: check-json
    exclude: ^(\.csslintrc|app/node_modules/|app/dist/|node_modules/|dist/)
  - id: check-merge-conflict
  - id: check-yaml
    args:
    - --allow-multiple-documents
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: detect-private-key
  - args:
    - --branch
    - main
    id: no-commit-to-branch
- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v4.0.0-alpha.8
  hooks:
  - id: prettier
    additional_dependencies:
    - prettier@^3.9.6
    - prettier-plugin-organize-imports@^4.3.0
    args:
    - --print-width=120
    - --tab-width=2
    - --use-tabs=false
    - --single-quote
    - --trailing-comma=es5
    exclude: ^(app/dist/|app/coverage/|app/node_modules/|dist/|coverage/|node_modules/)
    files: ^app/.*\.(css|js|ts|tsx|json|md)$
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.2.0-247
  hooks:
  - id: makefile-check
  - id: console-debug-detection
    files: \.(js|gs|ts|tsx|jsx)$
  - id: console-log-detection
    files: \.(js|gs|ts|tsx|jsx)$
  - id: console-table-detection
    files: \.(js|gs|ts|tsx|jsx)$
  - id: react-console-error-detection
  - id: no-console-warn
  - id: ts-unreachable-code
    additional_dependencies:
    - tree-sitter>=0.26.0
    - tree-sitter-typescript>=0.23.2
  - id: css-duplicate-property
  - id: import-no-relative-parent
  - id: react-direct-dom
  - id: dockerfile-no-latest
  - id: env-file-check
  - id: yaml-sorter
    exclude: ^(\.github/(workflows|ISSUE_TEMPLATE)/|GitVersion\.yml)
  - id: regression-gate
    stages:
    - pre-push
  - id: json-sorter
  - id: env-example-sync
  - id: adr-gate
  - id: debugger-detection
  - id: python-print-detection
  - id: python-pprint-detection
    exclude: tests?/
  - id: no-bare-except
  - id: python-logger-detection
  - id: python-unreachable-code
  - id: no-hardcoded-localhost
    exclude: tests?/|\.test\.|\.spec\.
  - id: claude-skill-frontmatter
  - id: claude-agent-frontmatter
  - id: claude-mcp-config
  - id: python-no-unittest-import
  - id: claude-assets-present
  - id: python-untyped-raise
    exclude: ^tests?/
  - id: python-mutable-default
  - id: python-dispatch-ladder
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
    - perf
    - revert
    - ci
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - args:
    - --fix
    id: markdownlint
    stages:
    - manual
- repo: https://github.com/chrysa/guideline-checker
  rev: v1.30.10
  hooks:
  - id: guideline-check
