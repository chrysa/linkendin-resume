---
name: Deploy

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Image tag to deploy (e.g. v1.2.0)
                required: true

permissions:
    contents: read
    packages: write

jobs:
    deploy:
        uses: chrysa/github-actions/.github/workflows/deploy.yml@v1.2.0
        with:
            image-base: ghcr.io/chrysa/resume
            tag: ${{ inputs.tag }}
            backend-context: .
            backend-dockerfile: docker/Dockerfile
            target: prod
            backend-build-args: |
                VITE_GITHUB_OWNER=chrysa
                VITE_GITHUB_REPO=contact
                VITE_DEMO_MODE=false
            gitops: true
            api-values-path: apps/dev/linkendin-resume/values.yaml
        secrets:
            release-token: ${{ secrets.RELEASE_TOKEN }}
