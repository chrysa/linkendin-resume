---
# Canonical CI workflow for Node.js / TypeScript projects (chrysa ecosystem),
# from chrysa/shared-standards workflows/ci-node.yml. Adapted to this repo's
# layout: the Node project lives in app/ (working-directory) and sonar sources
# are app/src. Lint (eslint/tsc/pre-commit) does NOT run here: it lives in
# pre-commit (local) and is replayed at release time.
#
# Job names (test / sonar) are the branch-protection required status checks.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - develop
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: warn

  sonar:
    name: SonarCloud
    if: ${{ github.actor != 'dependabot[bot]' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: chrysa/github-actions/sonar-scan-node@v1.10.0
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          project-key: chrysa_linkendin-resume
          organization: chrysa
          project-name: linkendin-resume
          sources: app/src
          tsconfig: app/tsconfig.json
