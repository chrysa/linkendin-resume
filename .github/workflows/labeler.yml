---
name: Pull Request Labels

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call:
    uses: chrysa/github-actions/.github/workflows/labeler.yml@v1.8.1
